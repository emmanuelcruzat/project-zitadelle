<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zitadelle Map Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #15160f; --panel: #1f2018; --line: #3e3a28; --line2: #5d5639; --ink: #e7dcb1; --ink2: #b9ae86; --mute: #857c5c; --amber: #d9b46b; --red: #d9573f; --ok: #9cc05a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 14px 'Oswald', 'Arial Narrow', sans-serif; overflow: hidden; }
button, input, select { font: inherit; color: var(--ink); }
.app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 52px 1fr; height: 100%; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #11130d; }
header .logo { font-family: 'Black Ops One', Impact, sans-serif; font-size: 22px; letter-spacing: 2px; }
header .sub { color: var(--mute); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }
header .sp { flex: 1; }
.btn { background: #2b2a20; border: 1px solid var(--line2); padding: 5px 12px; cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase; font-size: 12.5px; }
.btn:hover { background: #3a382a; }
a.btn, label.btn { color: var(--ink); text-decoration: none; }
.btn.primary { background: #7a2a1e; border-color: #b6503b; }
.btn.primary:hover { background: #933324; }
.btn.on { border-color: var(--amber); color: var(--amber); }
select.btn { padding: 4px 8px; }
.stage { position: relative; overflow: hidden; background: #0d0e09; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.toolbar { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.hint { position: absolute; left: 12px; bottom: 10px; color: var(--ink2); font-size: 12.5px; letter-spacing: .5px; background: rgba(13,14,9,.75); padding: 4px 8px; }
.busy { position: absolute; right: 12px; top: 12px; color: var(--amber); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; display: none; }
aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 10px 14px 30px; }
h3 { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--amber); margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
h3 .btn { font-size: 11px; padding: 1px 8px; }
.row { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
.row label { color: var(--ink2); font-size: 13px; }
.row input, .row select { background: #12120d; border: 1px solid var(--line); padding: 3px 6px; width: 100%; }
.row input[type=checkbox] { width: auto; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card { border: 1px solid var(--line); padding: 6px 8px; margin: 6px 0; background: #191a13; }
.card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.card .head b { font-weight: 500; letter-spacing: 1px; }
.card .head .btn { font-size: 11px; padding: 0 7px; }
.issues div { padding: 4px 6px; margin: 3px 0; font-size: 13px; cursor: pointer; border-left: 3px solid; background: #191a13; }
.issues .error { border-color: var(--red); color: #ffb3a3; }
.issues .warn { border-color: var(--amber); color: #f1dda9; }
.issues .ok { border-color: var(--ok); color: #cfe6a8; cursor: default; }
.note { color: var(--mute); font-size: 12.5px; line-height: 1.45; margin: 6px 0; }
code { font-family: Consolas, monospace; font-size: 12px; color: var(--ink); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">ZITADELLE</span><span class="sub">Map editor</span>
    <span class="sp"></span>
    <select id="loadSel" class="btn" title="Start from an existing map"></select>
    <button id="newBtn" class="btn">New</button>
    <label class="btn" title="Open a map file you saved before">Open file<input id="fileIn" type="file" accept=".js" hidden></label>
    <button id="saveBtn" class="btn primary">Download map file</button>
    <a class="btn" href="/play" style="text-decoration:none">Back to game</a>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toolbar">
      <button class="btn on" data-tool="move" title="Drag objectives, line starts, river points, the town centre and the defenders' rear">Move</button>
      <button class="btn" data-tool="river" title="Click to add a river point; right-click a river point to remove it">River</button>
      <button class="btn" id="fitBtn" title="Show the whole map">Fit</button>
      <label class="btn"><input type="checkbox" id="showBld" checked> Buildings</label>
    </div>
    <div class="busy" id="busy">Building…</div>
    <div class="hint" id="hint"></div>
  </div>
  <aside id="panel"></aside>
</div>
<script src="mapgen.js"></script>
<script src="mapcheck.js"></script>
<script src="editor.js"></script>
</body>
</html>
