<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zitadelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- home: theatre map of Europe; pick a battle, then the menu below picks a side -->
<div id="home" class="home">
  <svg id="eumap" class="eumap" preserveAspectRatio="none" aria-label="Map of Europe with the battles you can join"></svg>
  <div class="homevig"></div>
  <header class="homebar">
    <span class="homelogo">ZITADELLE</span>
    <span class="homesub">Theatre of operations &middot; Europe 1942&ndash;45</span>
    <span class="homespacer"></span>
    <a href="/editor" class="btn secondary hsmall" style="text-decoration:none">Map editor</a>
    <button id="homeinfo" class="btn secondary hsmall">Nation info</button>
    <button id="homeprog" class="btn secondary hsmall">Progression</button>
  </header>
  <aside id="brief" class="brief"></aside>
</div>

<div id="menu" class="overlay hidden">
  <div class="panel wide">
    <button id="tohome" class="tohome">&larr; Theatre map</button>
    <h1>ZITADELLE</h1>
    <div class="sub" id="menusub">Kursk Salient &middot; July 1943</div>
    <input id="name" maxlength="16" placeholder="Commander name" autocomplete="off" spellcheck="false">
    <div class="menulbl">Choose a Faction</div>
    <div class="factions">
      <button class="faction de" data-team="de"><canvas width="240" height="180"></canvas><span class="fname">Germany</span></button>
      <button class="faction su" data-team="su"><canvas width="240" height="180"></canvas><span class="fname">Soviet Union</span></button>
    </div>
    <button id="deploy" class="btn">Deploy</button>
    <div><button id="infobtn" class="btn secondary menuinfo">Nation info</button> <button id="progbtn" class="btn secondary menuinfo">Progression</button></div>
    <div id="status"></div>
  </div>
</div>

<!-- knocked out: a card in the corner while you pick where to redeploy on the battle map -->
<div id="death" class="deathcard hidden">
  <div class="dtitle">KNOCKED OUT</div>
  <div id="dkiller"></div>
  <div class="dstats">
    <div><span id="dscore">0</span><label>Score</label></div>
    <div><span id="dkills">0</span><label>Kills</label></div>
    <div><span id="ddeaths">0</span><label>Deaths</label></div>
    <div><span id="dtime">0:00</span><label>Survived</label></div>
  </div>
</div>

<!-- battle map controls (choosing a point) -->
<div id="mapbar" class="mapbar hidden">
  <button id="tohq" class="btn secondary" title="Only between battles">Switch sides (T)</button>
  <button id="mapinfo" class="btn secondary">Nation info</button>
  <button id="tomenu" class="btn secondary">Main menu</button>
</div>

<!-- after zooming in on the chosen point: pick a vehicle (you deploy with the round button on the point itself) -->
<div id="deploypanel" class="deploypanel hidden">
  <div class="dphead"><span id="dpname"></span></div>
  <div id="deathpick" class="picker"></div>
</div>

<!-- progression (prototype): account level, XP, and each nation's tech tree of vehicles to unlock -->
<div id="progress" class="overlay hidden">
  <div class="panel progpanel">
    <div class="proghead">
      <div class="proglvl"><span>Level</span><b id="plevel">1</b></div>
      <div class="progxp">
        <div class="progbar"><i id="pbar"></i></div>
        <div id="pxptext" class="progxptext"></div>
      </div>
      <div class="progfree"><span>XP to spend</span><b id="pfree">0</b></div>
    </div>
    <div class="prognations"><button class="pnat" data-n="de">Germany</button><button class="pnat" data-n="su">Soviet Union</button></div>
    <div id="ptree" class="ptree"></div>
    <div class="progfoot">
      <span class="proto">Prototype &middot; saved in this browser &middot; doesn't lock vehicles in battle yet</span>
      <button id="pgive" class="btn secondary psmall">+1,000 XP</button>
      <button id="preset" class="btn secondary psmall">Reset</button>
      <button id="pclose" class="btn secondary">Close (Esc)</button>
    </div>
  </div>
</div>

<!-- faction info: ranks and vehicles of each side (from the start menu or the deploy map) -->
<div id="info" class="overlay hidden">
  <div class="panel wide">
    <!-- first: the two coalitions side by side; each glows on hover, click to open it -->
    <div id="infohero" class="infohero">
      <button class="herohalf axis" data-coal="Axis">
        <canvas width="200" height="226" data-coalhead="Axis"></canvas>
        <span class="heroname">Axis</span>
        <span class="herotag">Bound by the Pact of Steel</span>
        <span class="heronations"><span data-n="de"><canvas width="64" height="64"></canvas>Germany</span><span data-n="it"><canvas width="64" height="64"></canvas>Italy</span></span>
      </button>
      <button class="herohalf allies" data-coal="Allies">
        <canvas width="200" height="226" data-coalhead="Allies"></canvas>
        <span class="heroname">Allies</span>
        <span class="herotag">The United Nations Fight for Freedom</span>
        <span class="heronations"><span data-n="su"><canvas width="64" height="64"></canvas>Soviet Union</span><span data-n="us"><canvas width="64" height="64"></canvas>United States</span><span data-n="gb"><canvas width="64" height="64"></canvas>United Kingdom</span></span>
      </button>
    </div>
    <!-- then: one coalition, with a selector for its nations -->
    <div id="infonation" class="hidden">
      <div class="infotabs">
        <button id="infoback" class="infoback">&larr; Coalitions</button>
        <div class="coalhead"><canvas width="64" height="72" id="coalbadge"></canvas><span id="coalname"></span></div>
        <div id="nationtabs" class="nationtabs"></div>
      </div>
      <div id="infobody"></div>
    </div>
    <button id="infoclose" class="btn secondary">Close (Esc)</button>
  </div>
</div>
<div id="infotip" class="infotip hidden"></div>
<!-- deploy picker: hold the mouse on a vehicle to see its armour -->
<div id="armortip" class="armortip hidden"><div class="atname"></div><canvas width="440" height="360"></canvas><div class="atgun"></div></div>

<!-- main gun ammo, bottom centre: a display, switched with 1 / 2 -->
<div id="ammobar" class="ammobar hidden">
  <div class="aslot" data-a="ap"><div class="abadge"><span class="aname">AP</span><svg class="shell" viewBox="0 0 20 52" aria-hidden="true"><path d="M10 2 C14.5 7 15.5 13 15.5 20 L15.5 24 L4.5 24 L4.5 20 C4.5 13 5.5 7 10 2 Z" fill="#d6cca3"/><rect x="4" y="24.6" width="12" height="2.6" fill="#c0392b"/><rect x="4.5" y="28" width="11" height="19" rx="1" fill="#d6cca3"/><rect x="3.5" y="47.6" width="13" height="2.6" rx="0.8" fill="#c0392b"/></svg></div><span class="apen"></span><span class="akey">1</span></div>
  <div class="aslot" data-a="apcr"><div class="abadge"><span class="aname">APCR</span><svg class="shell" viewBox="0 0 20 52" aria-hidden="true"><path d="M10 1.5 C12.6 5 13.4 10 13.4 16 L13.4 24 L6.6 24 L6.6 16 C6.6 10 7.4 5 10 1.5 Z" fill="#d6cca3"/><path d="M10 1.5 C11.8 4 12.7 7 13 10 L7 10 C7.3 7 8.2 4 10 1.5 Z" fill="#c0392b"/><rect x="4" y="24.6" width="12" height="2.6" fill="#c0392b"/><rect x="4.5" y="28" width="11" height="19" rx="1" fill="#d6cca3"/><rect x="3.5" y="47.6" width="13" height="2.6" rx="0.8" fill="#c0392b"/></svg></div><span class="apen"></span><span class="akey">2</span></div>
</div>

<!-- chat, lower left: Enter to type, Tab switches team / all, Enter sends, Esc cancels -->
<div id="chat" class="chat hidden">
  <div id="chatlog" class="chatlog"></div>
  <div id="chatbar" class="chatbar hidden"><span id="chatmode" class="chatmode team">TEAM</span><input id="chatinput" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Press TAB to switch channels"></div>
  <div id="chathint" class="chathint">Press ENTER to chat</div>
</div>

<script src="armor.js"></script>
<script src="map.js"></script>
<script src="water.js"></script>
<script src="forest.js"></script>
<script src="shared.js"></script>
<script src="europe.js"></script>
<script src="client.js"></script>
</body>
</html>
