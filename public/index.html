<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zitadelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay">
  <div class="panel wide">
    <h1>ZITADELLE</h1>
    <div class="sub">Kursk Salient &middot; July 1943</div>
    <input id="name" maxlength="16" placeholder="Commander name" autocomplete="off" spellcheck="false">
    <div class="menulbl">Choose a Faction</div>
    <div class="factions">
      <button class="faction de" data-team="de"><canvas width="240" height="180"></canvas><span class="fname">Germany</span></button>
      <button class="faction su" data-team="su"><canvas width="240" height="180"></canvas><span class="fname">Soviet Union</span></button>
    </div>
    <button id="deploy" class="btn">Deploy</button>
    <div><button id="infobtn" class="btn secondary menuinfo">Nation info</button></div>
    <div id="status"></div>
  </div>
</div>

<!-- knocked out: a card in the corner while you pick where to redeploy on the battle map -->
<div id="death" class="deathcard hidden">
  <div class="dtitle">KNOCKED OUT</div>
  <div id="dkiller"></div>
  <div class="dstats">
    <div><span id="dscore">0</span><label>Score</label></div>
    <div><span id="dkills">0</span><label>Kills</label></div>
    <div><span id="ddeaths">0</span><label>Deaths</label></div>
    <div><span id="dtime">0:00</span><label>Survived</label></div>
  </div>
</div>

<!-- battle map controls (choosing a point) -->
<div id="mapbar" class="mapbar hidden">
  <button id="tohq" class="btn secondary" title="Only between battles">Switch sides (T)</button>
  <button id="mapinfo" class="btn secondary">Nation info</button>
  <button id="tomenu" class="btn secondary">Main menu</button>
</div>

<!-- after zooming in on the chosen point: pick a vehicle (you deploy with the round button on the point itself) -->
<div id="deploypanel" class="deploypanel hidden">
  <div class="dphead"><span id="dpname"></span></div>
  <div id="deathpick" class="picker"></div>
</div>

<!-- faction info: ranks and vehicles of each side (from the start menu or the deploy map) -->
<div id="info" class="overlay hidden">
  <div class="panel wide">
    <!-- first: the two coalitions side by side; each glows on hover, click to open it -->
    <div id="infohero" class="infohero">
      <button class="herohalf axis" data-coal="Axis">
        <canvas width="200" height="226" data-coalhead="Axis"></canvas>
        <span class="heroname">Axis</span>
        <span class="herotag">Bound by the Pact of Steel</span>
        <span class="heronations"><span data-n="de"><canvas width="64" height="64"></canvas>Germany</span><span data-n="it"><canvas width="64" height="64"></canvas>Italy</span></span>
      </button>
      <button class="herohalf allies" data-coal="Allies">
        <canvas width="200" height="226" data-coalhead="Allies"></canvas>
        <span class="heroname">Allies</span>
        <span class="herotag">The United Nations Fight for Freedom</span>
        <span class="heronations"><span data-n="su"><canvas width="64" height="64"></canvas>Soviet Union</span><span data-n="us"><canvas width="64" height="64"></canvas>United States</span><span data-n="gb"><canvas width="64" height="64"></canvas>United Kingdom</span></span>
      </button>
    </div>
    <!-- then: one coalition, with a selector for its nations -->
    <div id="infonation" class="hidden">
      <div class="infotabs">
        <button id="infoback" class="infoback">&larr; Coalitions</button>
        <div class="coalhead"><canvas width="64" height="72" id="coalbadge"></canvas><span id="coalname"></span></div>
        <div id="nationtabs" class="nationtabs"></div>
      </div>
      <div id="infobody"></div>
    </div>
    <button id="infoclose" class="btn secondary">Close (Esc)</button>
  </div>
</div>
<div id="infotip" class="infotip hidden"></div>

<!-- chat, lower left: Enter to type, Tab switches team / all, Enter sends, Esc cancels -->
<div id="chat" class="chat hidden">
  <div id="chatlog" class="chatlog"></div>
  <div id="chatbar" class="chatbar hidden"><span id="chatmode" class="chatmode team">TEAM</span><input id="chatinput" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Press TAB to switch channels"></div>
  <div id="chathint" class="chathint">Press ENTER to chat</div>
</div>

<script src="shared.js"></script>
<script src="client.js"></script>
</body>
</html>
